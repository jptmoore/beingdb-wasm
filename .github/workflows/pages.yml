# Build, test and verify the browser tutorial as a static site, and deploy it
# to GitHub Pages from main. Pull requests, and manual runs on other branches,
# build and verify only.
#
# One-time repository setting: Settings > Pages > Build and deployment >
# Source: "GitHub Actions".
name: Tutorial site (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # BeingDB checkout the runtime is built from (vendor/ symlinks to ../beingdb).
  BEINGDB_REF: 749bb7a404fc7a82ae5f8c3eb7756c6a63ceea6a
  BINARYEN: version_133
  BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Check out BeingDB next to this repository
        run: |
          git init -q ../beingdb
          git -C ../beingdb fetch -q --depth 1 https://github.com/jptmoore/beingdb.git "$BEINGDB_REF"
          git -C ../beingdb checkout -q FETCH_HEAD
          test -d vendor/beingdb_runtime/

      - name: Install Binaryen
        run: |
          curl -fsSL -o /tmp/binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN/binaryen-$BINARYEN-x86_64-linux.tar.gz"
          echo "$BINARYEN_SHA256  /tmp/binaryen.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/binaryen.tar.gz -C /opt
          echo "/opt/binaryen-$BINARYEN/bin" >> "$GITHUB_PATH"

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.0

      - name: Install OCaml dependencies
        run: >-
          opam install -y dune.3.21.0 lwt.5.9.2 yojson.3.0.0 digestif.1.3.0
          js_of_ocaml.6.4.1 wasm_of_ocaml-compiler.6.4.1 conf-binaryen alcotest.1.9.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test (WASM parity, tutorial lessons)
        run: npm test

      - name: Build the static site
        run: npm run build:tutorial

      - name: Verify the static site under the Pages base path
        run: npm run verify:tutorial

      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}tutorial/
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # The live site, from a fresh browser: runtime loads, queries run, every
  # request stays under the Pages base path, .wasm is served as application/wasm.
  check-deployment:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify the deployed site
        run: node scripts/site.mjs verify --url "${{ needs.deploy.outputs.page_url }}"
