<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BeingDB tutorial</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>BeingDB tutorial</h1>
      <p id="status" class="status">Loading the BeingDB WebAssembly runtime…</p>
    </div>
    <button id="vocab-button" class="secondary" type="button" disabled>Predicates</button>
  </header>
  <div class="layout">
    <nav class="sidebar" aria-label="Lessons">
      <ol id="nav"></ol>
    </nav>
    <main id="lesson">
      <p class="loading">Loading…</p>
    </main>
  </div>
  <dialog id="vocabulary" aria-label="Predicates">
    <form method="dialog" class="dialog-head">
      <h2>Predicates</h2>
      <button class="ghost" aria-label="Close">Close</button>
    </form>
    <div class="dialog-body"></div>
  </dialog>
  <script src="format.js"></script>
  <script src="app.js"></script>
  <script src="../web/main.bc.wasm.js"></script>
</body>
</html>
