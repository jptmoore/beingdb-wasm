<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BeingDB WASM proof-of-concept</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 60rem; }
    textarea { width: 100%; height: 9rem; font-family: ui-monospace, monospace; }
    pre { background: #f4f4f4; padding: 1rem; overflow: auto; }
  </style>
</head>
<body>
  <h1>BeingDB WASM proof-of-concept</h1>
  <p>The real BeingDB DSL parser, planner and evaluator, compiled with wasm_of_ocaml,
     querying an export of the compiled Rewind interview pack.</p>
  <p>Status: <span id="status">Loading WASM…</span></p>
  <textarea id="query">find Artist, Work, Y
where
  created_by(Work, Artist)
  year_created(Work, Y)
  Y between 1975 and 1980
order by Y ascending</textarea>
  <p><button id="run" disabled>Run query</button> <button id="predicates" disabled>List predicates</button>
     <span id="timing"></span></p>
  <pre id="result"></pre>
  <script src="demo.js"></script>
  <script src="main.bc.wasm.js"></script>
</body>
</html>
